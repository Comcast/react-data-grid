name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

cache-mode: none

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # check out the repository

    # restore and save the Vite Task cache
    cache-mode: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          run-install: false

      - run: vp install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          EOF
          vp exec playwright install-deps
        timeout-minutes: 2

      # https://viteplus.dev/guide/github-actions-cache
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-

      # Vite Task compares directory listings with those recorded after the cached run,
      # so directories created during the run must exist upfront for the cache to hit:
      # https://github.com/voidzero-dev/vite-task/issues/504
      - run: mkdir lib coverage node_modules/.vite-temp

      - run: vp run -v ci
        timeout-minutes: 6

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts
          path: .vitest/attachments/**
          # `.vitest` is a hidden directory
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment originates from this workflow

    # one deployment at a time, never cancel one midway
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
