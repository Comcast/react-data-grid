name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false

      - run: vp install --frozen-lockfile

      - run: vp run typecheck

      - run: vp check

      - run: vp run lint:md

      - run: vp pack

      - run: vp build

      - name: Check routeTree.gen.ts
        run: git diff --exit-code website/routeTree.gen.ts

      - name: Install Playwright Browsers
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          EOF
          vp exec playwright install --with-deps --no-shell
        timeout-minutes: 2

      - run: vp test
        timeout-minutes: 4

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: .vitest/attachments/**
          if-no-files-found: ignore

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Deploy gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.email 'action@github.com'
          git config --global user.name 'GitHub Action'
          git fetch origin gh-pages
          git worktree add gh-pages gh-pages
          cd gh-pages
          git rm -r .
          mv ../dist/* .
          touch .nojekyll
          git add .
          git commit -m "gh-pages deployment" || echo "Nothing to commit"
          git push -f https://comcast:${{secrets.GITHUB_TOKEN}}@github.com/Comcast/react-data-grid.git
