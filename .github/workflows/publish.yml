name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1, 0.2.0, 1.0.0)'
        required: true
        type: string

permissions: {}

cache-mode: none

# never run two publishes at once, and never cancel one midway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # push the version tag and create the GitHub release
      id-token: write # npm trusted publishing

    env:
      VERSION: ${{ inputs.version }}

    steps:
      # credentials are persisted to push the version tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: false
          registry-url: 'https://registry.npmjs.org'

      - run: vp install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          EOF
          vp exec playwright install-deps
        timeout-minutes: 2

      # before `vp run ci`, so `vp pack` prefixes classes with the new version
      - name: Update version
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          npm version "$VERSION"

      - run: vp run ci
        timeout-minutes: 6

      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm
        run: npm publish --tag latest

      - name: Push tag
        run: git push origin "v$VERSION"

      - name: Create GitHub Release
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
