name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1, 0.2.0, 1.0.0)'
        required: true
        type: string

cache-mode: none

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          run-install: false
          registry-url: 'https://registry.npmjs.org'

      - run: vp install --frozen-lockfile

      - run: vp run typecheck

      - run: vp check

      - run: vp run eslint

      - run: vp pack

      - run: vp build

      - name: Check routeTree.gen.ts
        run: git diff --exit-code website/routeTree.gen.ts

      - name: Install Playwright Browsers
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          EOF
          vp exec playwright install --with-deps --no-shell
        timeout-minutes: 2

      - run: vp test
        timeout-minutes: 4

      - name: Update version
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          npm version ${{ inputs.version }}

      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm
        run: npm publish --tag latest

      - name: Push tag
        run: git push origin v${{ inputs.version }}

      - name: Create GitHub Release
        run: gh release create v${{ inputs.version }} --title "v${{ inputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
