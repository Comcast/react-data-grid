name: Update Screenshots

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

cache-mode: none

env:
  FORCE_COLOR: 1

jobs:
  update-screenshots:
    if: ${{ github.event.label.name == 'Update Screenshots' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # push the new screenshots
      pull-requests: write # remove the label

    # one at a time per branch
    concurrency:
      group: update-screenshots@${{ github.head_ref || github.ref }}
      cancel-in-progress: true

    steps:
      # credentials are persisted to push the new screenshots
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: false

      - name: Remove label
        if: github.event_name == 'pull_request'
        run: gh pr edit --remove-label 'Update Screenshots'
        env:
          GH_TOKEN: ${{ github.token }}

      - run: vp install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          EOF
          vp exec playwright install-deps
        timeout-minutes: 2

      - run: rm -r test/**/screenshots/**

      - run: vp run test --project visual --update
        timeout-minutes: 4

      - name: Push new screenshots
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add "test/**/screenshots/**"
          git diff-index --quiet HEAD || git commit -m "Update screenshots"
          git push
