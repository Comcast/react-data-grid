name: Update Screenshots

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

cache-mode: none

jobs:
  update-screenshots:
    if: ${{ github.event.label.name == 'Update Screenshots' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    # one at a time per branch
    concurrency:
      group: update-screenshots@${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          run-install: false

      - name: Remove label
        if: github.event_name == 'pull_request'
        run: gh pr edit --remove-label 'Update Screenshots'
        env:
          GH_TOKEN: ${{ github.token }}

      - run: vp install --frozen-lockfile

      - name: Install Playwright Browsers
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          EOF
          vp exec playwright install --with-deps --no-shell
        timeout-minutes: 2

      - run: rm -r test/**/screenshots/**

      - run: vp test --project visual --update
        timeout-minutes: 4

      - name: Push new screenshots
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add "test/**/screenshots/**"
          git diff-index --quiet HEAD || git commit -m "Update screenshots"
          git push
