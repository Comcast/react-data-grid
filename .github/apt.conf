// Installed as /etc/apt/apt.conf, which apt reads after /etc/apt/apt.conf.d/,
// so it overrides the runner image's settings.

// The runner image turns off pipelining, so each package costs a round trip,
// and downloading them from archive.ubuntu.com takes several times longer.
// No proxy can break pipelining over HTTPS.
Acquire::https::Pipeline-Depth "10";
