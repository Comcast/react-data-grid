# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Vite+ and the packages it keeps aligned are updated with `vp migrate`:
    # https://viteplus.dev/guide/upgrade-project
    ignore:
      - dependency-name: 'vite-plus'
      - dependency-name: 'vite'
      - dependency-name: '@voidzero-dev/*'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
    groups:
      typescript:
        patterns:
          - 'typescript'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # everything else: single PR for minor/patch bumps,
      # majors still land individually
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
