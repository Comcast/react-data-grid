# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      typescript:
        patterns:
          - 'typescript'
      build-tooling:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
          - 'vitest-*'
          - '@vitest/*'
          - 'tsdown'
          - '@tsdown/*'
          - 'playwright'
        exclude-patterns:
          - '@vitest/eslint-plugin'
      quality:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      tanstack:
        patterns:
          - '@tanstack/*'
      # everything else: single PR for minor/patch bumps,
      # majors still land individually
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
